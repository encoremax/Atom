name: Discord Annuncio

on:
  push:
    branches:
      - main

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Invia annuncio su Discord
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "username": "Silent Scream",
            "embeds": [{
              "title": "🟣 SILENT SCREAM — UPDATE",
              "description": "Un nuovo aggiornamento è stato pubblicato sul sito di Silent Scream RP.",
              "color": 9043962,
              "footer": {
                "text": "Silent Scream RP"
              }
            }]
          }' \
          "${{ secrets.DISCORD_WEBHOOK }}"
